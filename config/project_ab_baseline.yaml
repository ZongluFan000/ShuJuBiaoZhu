paths:
  patient_dir: "data/input/patient"
  rules_file: "data/input/rules.xlsx"
  output_dir: "data/ab_experiment/baseline"
  log_dir: "data/ab_experiment/baseline_logs"
  checkpoint_db: "data/ab_experiment/baseline_checkpoint/progress.sqlite"

run:
  mode: "full"
  concurrency: 1
  rule_concurrency: 4
  resume: false
  write_xlsx: false
  model_preflight: true
  max_consecutive_llm_failures: 5

labeling:
  use_structured_judge: false
  apply_missing_policy: true
  group_rules_for_llm: true
  llm_batch_size: 5
  max_evidence_chars_per_section: 600
  max_total_evidence_chars: 2200

optimization:
  enabled: false
