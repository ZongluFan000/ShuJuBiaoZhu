paths:
  patient_dir: "data/input/patient"
  rules_file: "data/input/rules.xlsx"
  output_dir: "data/output_full_ai_only_model2"
  log_dir: "data/logs_full_ai_only_model2"
  checkpoint_db: "data/checkpoint_full_ai_only_model2/progress.sqlite"

run:
  mode: "full"
  concurrency: 2
  rule_concurrency: 4
  resume: true
  write_xlsx: false
  model_preflight: true
  max_consecutive_llm_failures: 5

labeling:
  use_structured_judge: false
  apply_missing_policy: false
  group_rules_for_llm: true
  use_compact_prompt: true
  llm_batch_size: 10
  max_evidence_chars_per_section: 600
  max_total_evidence_chars: 2200

optimization:
  enabled: true
  merge_exact_duplicates: false
  use_reviewed_equivalent_groups: false
  reviewed_groups_file: "config/reviewed_equivalent_rules.json"
  max_batch_rules: 10
  max_simple_batch_rules: 10
  max_normal_batch_rules: 9
  max_complex_batch_rules: 3
  batch_complexity_budget: 32
  max_batch_rule_chars: 3000
  estimated_output_tokens_per_rule: 90
  output_token_reserve: 128
